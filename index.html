    <!-- Build v2026.09.11 — cache-consistency hardening: removed PWA manifest link (no
         service worker is registered anywhere in the app, so the manifest only risked
         app-shell caching of stale assets). HTML document marked no-cache so browsers
         always revalidate and pick up the newest content-hashed JS/CSS on each build. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- LCP: preload the above-the-fold brand lockup, before the app bundle is
         parsed. UnifiedHeader renders a <picture> that serves exactly one of
         these two files per breakpoint, and the preload carries the same media
         query, so only the file that will actually paint is ever fetched.
         Priority is left at auto on purpose: the homepage hero image declares
         fetchpriority="high" itself, and it must not be overtaken by the logo.
         Skipped on the portfolio host, whose header is text-only. -->
    <script>
      (function () {
        if (/lisakocian\.com$/i.test(location.hostname)) return;
        [
          ['(max-width: 767px)', 'https://media.base44.com/images/public/69afc77e4c80e5e88ca6e3ec/2ea4e9465_02-15439.png'],
          ['(min-width: 768px)', 'https://media.base44.com/images/public/69afc77e4c80e5e88ca6e3ec/2ea4e9465_02-15439.png']
        ].forEach(function (pair) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.href = pair[1];
          l.media = pair[0];
          document.head.appendChild(l);
        });
      })();
    </script>

    <!-- Google Analytics GA4 — Measurement ID: G-8K12DZR59E
         send_page_view: false — SPA page views are fired manually by useAnalytics()
         hook in App.jsx. This prevents the duplicate: GA4 auto page_view + manual page_view.
         ONE authoritative source: lib/analytics.js → hooks/useAnalytics.js
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // send_page_view: false — manually fired per route change by useAnalytics hook
      gtag('config', 'G-8K12DZR59E', {
        send_page_view: false,
        allow_google_signals: true,
        allow_ad_personalization_signals: true
      });
    </script>
    <script>
      // Load GA4 after page is interactive to reduce TBT
      function loadGA() {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-8K12DZR59E';
        document.head.appendChild(s);
      }
      if (document.readyState === 'complete') {
        loadGA();
      } else {
        window.addEventListener('load', loadGA, { passive: true, once: true });
      }
    </script>

    <!-- ── Portfolio host: correct the initial HTML on lisakocian.com ────────────
         This index.html is shared by every domain connected to this app, so the
         Torch Republic tags above are also served on the portfolio host. This
         block runs before anything renders and, ONLY on lisakocian.com:
           • writes the portfolio title, description, canonical, and social tags
             for the route actually being requested
           • disables the Torch Republic Organization / WebSite JSON-LD above, so
             no coffee structured data reaches a crawler that runs JavaScript
         torchrepublic.com returns on the first line and is completely untouched.
         Route copy mirrors src/components/portfolio/portfolioTheme.js.
         NOTE: this is still client-side. True static per-host HTML requires the
         portfolio to run as its own app — see lisakocian-robots.txt. -->
    <script>
      (function () {
        if (!/lisakocian\.com$/i.test(location.hostname)) return;

        var ORIGIN = 'https://lisakocian.com';
        var OG_IMAGE = 'https://media.base44.com/images/public/69afc77e4c80e5e88ca6e3ec/8e8524676_generated_image.png';
        var OG_ALT = 'Lisa Marie Kocian, AI quality assurance and content evaluation portfolio.';
        var HOME_DESC = 'Portfolio of Lisa Marie Kocian, an AI quality assurance and content evaluation specialist focused on output validation, document quality, workflow testing, defect documentation, and e-commerce QA.';

        var ROUTES = {
          '/': {
            title: 'Lisa Kocian | AI Quality Assurance & Content Evaluation',
            description: HOME_DESC,
            canonical: ORIGIN + '/',
            type: 'website'
          },
          '/case-studies/torch-republic': {
            title: 'Torch Republic Case Study | Lisa Marie Kocian',
            description: 'Case study of Torch Republic: e-commerce UX, workflow QA, and evaluation of AI-assisted commerce — catalog data precision, cart and checkout friction, automation integrity, and measured before/after results.',
            canonical: ORIGIN + '/case-studies/torch-republic',
            type: 'article'
          },
          '/case-studies/lukes-light': {
            title: "Luke's Light Case Study | Lisa Marie Kocian",
            description: "Case study of Luke's Light: content quality evaluation, hallucination control, readability, accessibility, and usability QA for an educational youth resource built with AI-assisted content.",
            canonical: ORIGIN + '/case-studies/lukes-light',
            type: 'article'
          },
          // Legacy paths — still served, canonicalised to the deep-dive routes.
          '/case-study': {
            title: 'Torch Republic Case Study | Lisa Marie Kocian',
            description: 'Case study of Torch Republic: e-commerce UX, workflow QA, and evaluation of AI-assisted commerce.',
            canonical: ORIGIN + '/case-studies/torch-republic',
            type: 'article'
          },
          '/case-study/lukes-light': {
            title: "Luke's Light Case Study | Lisa Marie Kocian",
            description: "Case study of Luke's Light: content quality evaluation and usability QA for an educational youth resource.",
            canonical: ORIGIN + '/case-studies/lukes-light',
            type: 'article'
          }
        };

        var path = location.pathname.replace(/\/+$/, '') || '/';
        var route = ROUTES[path];
        var robots = 'index, follow';
        if (!route) {
          route = { title: 'Page not found | Lisa Marie Kocian', description: HOME_DESC, canonical: ORIGIN + '/', type: 'website' };
          robots = 'noindex, follow';
        }

        document.title = route.title;

        var setMeta = function (attr, key, value) {
          var el = document.head.querySelector('meta[' + attr + '="' + key + '"]');
          if (!el) {
            el = document.createElement('meta');
            el.setAttribute(attr, key);
            document.head.appendChild(el);
          }
          el.setAttribute('content', value);
        };

        var canon = document.head.querySelector('link[rel="canonical"]');
        if (!canon) {
          canon = document.createElement('link');
          canon.setAttribute('rel', 'canonical');
          document.head.appendChild(canon);
        }
        canon.setAttribute('href', route.canonical);

        setMeta('name', 'description', route.description);
        setMeta('name', 'robots', robots);
        setMeta('name', 'googlebot', robots);
        setMeta('name', 'keywords', '');
        setMeta('name', 'theme-color', '#0A0A0C');
        setMeta('property', 'og:title', route.title);
        setMeta('property', 'og:description', route.description);
        setMeta('property', 'og:url', route.canonical);
        setMeta('property', 'og:type', route.type);
        setMeta('property', 'og:site_name', 'Lisa Marie Kocian');
        setMeta('property', 'og:image', OG_IMAGE);
        setMeta('property', 'og:image:secure_url', OG_IMAGE);
        setMeta('property', 'og:image:alt', OG_ALT);
        setMeta('name', 'twitter:card', 'summary_large_image');
        setMeta('name', 'twitter:title', route.title);
        setMeta('name', 'twitter:description', route.description);
        setMeta('name', 'twitter:image', OG_IMAGE);
        setMeta('name', 'twitter:image:alt', OG_ALT);
        setMeta('name', 'twitter:site', '');
        setMeta('name', 'twitter:creator', '');

        var brand = document.head.querySelectorAll('script[data-torch-brand-schema]');
        for (var i = 0; i < brand.length; i++) {
          brand[i].setAttribute('type', 'application/x-torch-disabled');
        }
      })();
    </script>
